name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: IUCLabs/workflows/.github/workflows/pre-commit.yml@v0.1.0
    permissions:
      contents: read
    with:
      go_version_file: go.mod

  actions:
    uses: IUCLabs/workflows/.github/workflows/actions.yml@v0.1.0
    permissions:
      contents: read

  go:
    uses: IUCLabs/workflows/.github/workflows/go-ci.yml@v0.1.0
    permissions:
      contents: read
      pull-requests: read
    with:
      go_vet: false
      golangci_lint_version: v2.15.0
      # no docker on the runner: -short skips container tests; seccomp denies keyctl, so the keyring is excluded
      test_args: -count=1 -short ./...
      cover_min: 90
      cover_exclude: /pg/pgtest/|/keyring/keyring_linux.go
      strip: false
