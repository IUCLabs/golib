name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: iuclabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  lint:
    runs-on: iuclabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: iuclabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: grep -i -E 'seccomp|uid|cap' /proc/self/status; cat /proc/key-users || true; go run ./.diag
      # no C toolchain (no -race) and no docker (-short skips container tests)
      - run: go test -count=1 -short -coverprofile=cover.out ./...
      - name: coverage gate (90%, excluding pg/pgtest)
        run: |
          grep -Ev '/pg/pgtest/' cover.out > cover.filtered.out
          go tool cover -func=cover.filtered.out | awk -v min=90 '
            /^total:/ { seen = 1; pct = $3; sub(/%/, "", pct);
              printf "total coverage: %s%% (minimum %d%%)\n", pct, min;
              if (pct + 0 < min + 0) { print "coverage below minimum" > "/dev/stderr"; exit 1 } }
            END { if (!seen) { print "no total in coverage output" > "/dev/stderr"; exit 1 } }'

  build:
    runs-on: iuclabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go build ./...
