when:
  - event: pull_request

steps:
  - name: build
    image: golang:1.25
    commands:
      # golib ships no binaries, so the build is a compile check over every
      # package, including the test-only pgtest helper.
      - make build
    backend_options:
      kubernetes:
        serviceAccountName: golib-ci
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2
