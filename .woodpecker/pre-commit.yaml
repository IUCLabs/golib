when:
  - event: pull_request

steps:
  - name: pre-commit
    image: golang:1.25
    commands:
      - test -z "$(gofmt -l .)"
      - go vet ./...
    backend_options:
      kubernetes:
        serviceAccountName: golib-ci
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2

  - name: lint
    image: golangci/golangci-lint:latest
    commands:
      - golangci-lint run ./...
    backend_options:
      kubernetes:
        serviceAccountName: golib-ci
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2

  - name: hooks
    image: git.unkin.net/unkin/almalinux9-gobuilder:20260606
    commands:
      - uvx pre-commit run --all-files
    backend_options:
      kubernetes:
        serviceAccountName: golib-ci
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2
