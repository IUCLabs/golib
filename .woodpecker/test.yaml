when:
  - event: pull_request

steps:
  - name: test
    image: golang:1.25
    commands:
      # Coverage-gated unit tests. The container-backed integration tests skip
      # themselves under -short; the Kubernetes runners have no Docker socket.
      - make cover
    backend_options:
      kubernetes:
        serviceAccountName: golib-ci
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2
